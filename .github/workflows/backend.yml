name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ejecutar pruebas
        run: python -m pytest -q

  # La app Flutter (análisis, pruebas y APK de depuración) se comprueba en android.yml, que corre cuando cambia
  # mobile/. Aquí se ejecutaba en cada push, también en las subidas de canciones, y nunca compilaba el APK.

  limites-repositorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar límites de GitHub
        run: python scripts/check_repo_limits.py
