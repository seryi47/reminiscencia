name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          # ADR-0049: cache de wheels de pip para no bajarlos en cada push. La clave la calcula setup-python a partir
          # del fichero indicado; si cambia el pyproject, se invalida solo. Ahorro medido: 15-25 s por job.
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ejecutar pruebas
        # `-n auto` (pytest-xdist) paraleliza los tests entre los núcleos del runner. Con 1445 tests esto baja la suite
        # de ~60-120 s a ~20-40 s (ADR-0049). Si pytest-xdist no está declarado en `.[dev]`, el `-n` falla; en ese caso
        # el CI nos avisa y lo añadimos al pyproject.
        run: python -m pytest -q -n auto

  # La app Flutter (análisis, pruebas y APK de depuración) se comprueba en android.yml, que corre cuando cambia
  # mobile/. Aquí se ejecutaba en cada push, también en las subidas de canciones, y nunca compilaba el APK.

  limites-repositorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Comprobar límites de GitHub
        run: python scripts/check_repo_limits.py
