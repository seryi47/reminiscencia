name: r2

# Repaso del audio en Cloudflare R2 (ADR-0020 y ADR-0024). El audio lo suben a R2 los jobs 'publicar' de buzon.yml y
# biblioteca.yml antes de subir a main (fase 3); este workflow vuelve a comprobarlo cuando terminan, o a mano, y copia
# al bucket público lo que le falte de las canciones públicas, desde el bucket privado (el audio ya no está en Git,
# ADR-0024). Avisa de las canciones del catálogo sin audio en el privado. Sin permiso de escritura en el repositorio:
# las credenciales de R2 solo llegan a este workflow, que ejecuta código de main y no el de ninguna subida. Nunca borra
# nada de ningún bucket (eso solo lo hace 'publicar', y solo en el público).

on:
  workflow_run:
    workflows: [buzon, biblioteca]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "frontend/web/data/songs.json"
  workflow_dispatch:

concurrency:
  group: r2
  cancel-in-progress: false

jobs:
  subir:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Obtener main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Subir el audio nuevo a R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
        run: |
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_PRIVATE_BUCKET" ]; then
            echo "R2 no está configurado: se omite."
            exit 0
          fi
          python scripts/sync_r2.py --aplicar
