name: biblioteca

# Escrituras al catálogo de la biblioteca (ADR-0008). Entrada única: una incidencia con la etiqueta 'biblioteca'
# (cuerpo con líneas 'clave: valor') o el formulario manual. Solo envían incidencias las personas con permiso de
# escritura en el repositorio (admin, maintain o write); a las demás, 'autorizar' solo les responde en la incidencia.
# Tres jobs con distintos permisos. 'autorizar' comprueba el permiso del autor. 'procesar' descarga y convierte sin
# token ni permisos de escritura, y deja en un artefacto solo los ficheros de la biblioteca que cambió (el catálogo y
# el audio, sin la parte pública). 'publicar' valida ese artefacto (rutas de la biblioteca, sin enlaces simbólicos,
# base igual a main o un antecesor compatible, ADR-0025), lo aplica, regenera la parte pública desde el catálogo,
# confirma, sube el audio a R2 (ADR-0020 y ADR-0024), sube a main y responde a la
# incidencia. Publicar no ejecuta ffmpeg ni código del árbol de trabajo del procesado.
# Ningún texto de la incidencia ni de los campos se interpola en un script: todo pasa por variables de entorno.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      action:
        description: "Qué hacer"
        required: true
        type: choice
        options: [import, organize]
      url:
        description: "URL de la fuente (import)"
        required: false
        default: ""
      license:
        description: "Licencia (obligatoria en ficheros directos; opcional en Internet Archive)"
        required: false
        default: ""
      title:
        description: "Título (import, opcional)"
        required: false
        default: ""
      payload:
        description: "Operación de organize: un objeto JSON en una sola línea"
        required: false
        default: ""

# Una escritura cada vez: dos cambios simultáneos al catálogo se pisarían. Con queue: max, una petición en espera
# no se cancela cuando llega otra (sin queue se cancela sin comentario ni etiqueta). Va a nivel de workflow: la
# petición entera, procesado y publicación, es una sola escritura.
concurrency:
  group: library-catalog
  cancel-in-progress: false
  queue: max

jobs:
  autorizar:
    # Solo incidencias nuevas con la etiqueta 'biblioteca' o con el cuerpo «action: organize» (las crea /api/editar,
    # cuyo token no puede poner etiquetas; ADR-0022). El autor debe tener permiso de escritura en el repositorio
    # (admin, maintain o write). Sin permiso, solo comenta la incidencia y no hace nada más.
    if: >-
      github.event_name == 'issues' &&
      (contains(github.event.issue.labels.*.name, 'biblioteca') ||
      startsWith(github.event.issue.body, 'action: organize'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    defaults:
      run:
        shell: bash
    outputs:
      permitido: ${{ steps.permiso.outputs.permitido }}
    steps:
      # Sin checkout: este job no ejecuta código del repositorio. Solo consulta el permiso del autor y, si falta, comenta.
      - name: Comprobar el permiso del autor
        id: permiso
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOR: ${{ github.event.issue.user.login }}
        run: |
          # Si la consulta falla (por ejemplo, el autor no es colaborador), cuenta como sin permiso.
          if ! PERMISO=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTOR/permission" --jq .permission); then
            PERMISO=none
          fi
          echo "Permiso de $AUTOR: $PERMISO"
          case "$PERMISO" in
            admin|maintain|write) echo "permitido=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "permitido=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Avisar si no tiene permiso
        if: steps.permiso.outputs.permitido != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body "Solo colaboradores con permiso de escritura pueden enviar peticiones a la biblioteca."

  procesar:
    # Incidencias: solo si 'autorizar' ha dado permiso al autor. Manual: siempre. always() permite que el manual
    # corra aunque 'autorizar' se haya omitido.
    needs: autorizar
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.autorizar.outputs.permitido == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      preparar: ${{ steps.preparar.outcome }}
      aplicar: ${{ steps.aplicar.outcome }}
    steps:
      # Sin credenciales en el disco: el procesado no tiene nada con que escribir en el repositorio.
      # ref: main, no el commit del evento: las peticiones esperan en cola y, cuando les llega el turno, main ya
      # tiene la anterior. Con el commit del evento, publicar las rechazaba por base desfasada.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # Solo main procesa. Va antes de instalar nada: la instalación también ejecuta código del árbol.
      - name: Guarda de rama
        run: |
          mkdir -p "$RUNNER_TEMP/paquete"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "El catálogo solo se procesa desde main (ejecución desde $GITHUB_REF_NAME)." >&2
            printf '%s\n' '{"error": "El catálogo solo se procesa desde main."}' > "$RUNNER_TEMP/paquete/peticion.json"
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # ffmpeg ESTÁTICO fijado por SHA256 y cacheado (ADR-0042), en vez de apt (que descargaba de un mirror lento y
      # colgaba la cola). Las importaciones por incidencia traen formatos variados, así que aquí siempre hace falta.
      - name: Preparar ffmpeg (estático, cacheado)
        id: ffmpeg_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ffmpeg-bin
          key: ffmpeg-static-btbn-n8.1.3-34-ga35157abb9-gpl

      - name: Descargar ffmpeg estático si no está en caché
        if: steps.ffmpeg_cache.outputs.cache-hit != 'true'
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-09-12-42/ffmpeg-n8.1.3-34-ga35157abb9-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 23c6279d9f10afbcc273082256ae2073495595ab53fbcd729a5a93913b3fdd75
        run: |
          curl -fsSL "$FFMPEG_URL" -o "$RUNNER_TEMP/ffmpeg.tar.xz"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p ~/ffmpeg-bin
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" --wildcards --strip-components=2 -C ~/ffmpeg-bin '*/bin/ffmpeg' '*/bin/ffprobe'

      - name: Poner ffmpeg en el PATH
        run: |
          chmod +x ~/ffmpeg-bin/ffmpeg ~/ffmpeg-bin/ffprobe
          echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
          ~/ffmpeg-bin/ffmpeg -version | head -n 1
          ~/ffmpeg-bin/ffprobe -version | head -n 1

      - name: Instalar el backend
        run: pip install -q -e backend

      - name: Preparar la petición
        id: preparar
        env:
          EVENTO: ${{ github.event_name }}
          BODY: ${{ github.event.issue.body }}
          ACTION: ${{ inputs.action }}
          URL: ${{ inputs.url }}
          LICENSE: ${{ inputs.license }}
          TITLE: ${{ inputs.title }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          if [ "$EVENTO" = "issues" ]; then
            MODO=incidencia
          else
            MODO=manual
          fi
          python scripts/issue_request.py --modo "$MODO" | tee "$RUNNER_TEMP/paquete/peticion.json"

      - name: Aplicar
        id: aplicar
        if: success()
        run: |
          estado=0
          python scripts/ci_library.py | tee "$RUNNER_TEMP/paquete/resultado.json" || estado=$?
          {
            echo "## Resultado"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/paquete/resultado.json"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$estado"

      - name: Empaquetar los cambios
        if: success()
        run: python scripts/empaquetar_cambios.py --salida "$RUNNER_TEMP/paquete"

      - name: Subir el paquete
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: biblioteca-paquete
          path: ${{ runner.temp }}/paquete
          retention-days: 1
          if-no-files-found: warn

  publicar:
    needs: [autorizar, procesar]
    # Las mismas condiciones que el procesado. always(): la respuesta a la incidencia sale también si el
    # procesado falló. Sin cancelación: una ejecución cancelada no escribe nada.
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.autorizar.outputs.permitido == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      # Con el historial de commits y árboles (sin el contenido de los ficheros antiguos): hace falta para comprobar si la
      # base del paquete es un antecesor de main y qué cambió desde entonces (ADR-0025).
      - name: Obtener main
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Preparar Python
        if: always()
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Descargar el paquete
        id: descargar
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: biblioteca-paquete
          path: ${{ runner.temp }}/paquete

      # Solo si el procesado terminó bien. El paquete se valida antes de tocar el repositorio, y la parte pública se
      # regenera desde el catálogo: no se acepta la que el paquete pudiera traer.
      - name: Validar, aplicar y regenerar la parte pública
        id: aplicar_paquete
        if: needs.procesar.result == 'success' && steps.descargar.outcome == 'success'
        run: python scripts/aplicar_paquete.py --paquete "$RUNNER_TEMP/paquete"

      - name: Confirmar cambios
        if: steps.aplicar_paquete.outcome == 'success'
        run: |
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          python scripts/check_repo_limits.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "biblioteca: $ACCION"

      # El audio nuevo va al bucket privado (la fuente de verdad, ADR-0024) y el de las canciones públicas al público
      # (el único que lo sirve, ADR-0020) antes de que main (y con él la web y la APK) las anuncie; se borra del público
      # el de las despublicadas. Si una canción pública no tiene audio en ningún sitio, o R2 falla, no se sube nada a
      # main. Las credenciales de R2 solo llegan a este paso, que no tiene el token de GitHub ni instala nada (sync_r2
      # usa solo la biblioteca estándar de Python).
      - name: Subir el audio a R2
        if: steps.aplicar_paquete.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "R2 solo se actualiza desde main (ejecución desde $GITHUB_REF_NAME)." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$BASE" ]; then
            echo "Sin cambios: R2 no se toca."
            exit 0
          fi
          python scripts/sync_r2.py --aplicar --borrar-sobrantes

      # El token solo llega a este paso, y solo para traer main y subir. Solo main escribe en el catálogo: un lanzamiento
      # manual desde otra rama no empuja su código a main. Si main avanzó desde que se aplicó el paquete (una subida, por
      # ejemplo), se trae, se rebasa el commit encima y se reintenta, hasta tres veces, siempre que lo nuevo de main no
      # toque lo que cambia este commit ni lo que la publicación lee o regenera (las rutas de
      # sonidos.paquete.ruta_de_publicacion; ADR-0025). Si lo toca o el rebase choca, no sube nada.
      - name: Subir a main
        id: guardar
        if: steps.aplicar_paquete.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "El catálogo solo se escribe desde main (ejecución desde $GITHUB_REF_NAME)." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$BASE" ]; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          REMOTO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUBLICACION='^(audio-library/indexes/catalog\.json$|audio-library/(audio|covers)/|frontend/web/(audio|data|covers)/)'
          for intento in 1 2 3 4; do
            if git push -q "$REMOTO" HEAD:main; then
              exit 0
            fi
            if [ "$intento" -eq 4 ]; then
              echo "main no deja de cambiar: no se ha subido tras tres reintentos. Hay que reenviar la petición." >&2
              exit 1
            fi
            git fetch -q --no-tags "$REMOTO" main
            if [ "$(git rev-parse FETCH_HEAD)" = "$BASE" ]; then
              echo "La subida a main ha fallado y main no ha cambiado: no se reintenta." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$BASE" FETCH_HEAD; then
              echo "main se ha reescrito desde que se aplicó el paquete: no se sube nada. Hay que reenviar la petición." >&2
              exit 1
            fi
            PROPIAS=$(git diff --name-only --no-renames "$BASE" HEAD)
            AJENAS=$(git diff --name-only --no-renames "$BASE" FETCH_HEAD)
            CHOQUE=$(grep -E "$PUBLICACION" <<<"$AJENAS" | head -n 1 || true)
            if [ -z "$CHOQUE" ]; then
              CHOQUE=$(grep -Fx -f <(printf '%s\n' "$PROPIAS") <<<"$AJENAS" | head -n 1 || true)
            fi
            if [ -n "$CHOQUE" ]; then
              echo "main cambió mientras se publicaba y el cambio toca $CHOQUE: no se sube nada. Hay que reenviar la petición." >&2
              exit 1
            fi
            if ! git rebase -q FETCH_HEAD; then
              git rebase --abort || true
              echo "El rebase sobre main choca: no se sube nada. Hay que reenviar la petición." >&2
              exit 1
            fi
            echo "main había avanzado sin tocar la biblioteca: commit rebasado encima (reintento $intento de 3)."
            BASE=$(git rev-parse FETCH_HEAD)
          done

      - name: Responder
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
          ESTADO_PREPARAR: ${{ needs.procesar.outputs.preparar }}
          ESTADO_APLICAR: ${{ needs.procesar.outputs.aplicar }}
          ESTADO_GUARDAR: ${{ steps.guardar.outcome }}
        run: |
          RESULTADO=$(python scripts/responder_incidencia.py --peticion "$RUNNER_TEMP/paquete/peticion.json" --resultado "$RUNNER_TEMP/paquete/resultado.json" --cuerpo "$RUNNER_TEMP/comentario.md")
          gh issue comment "$NUMERO" --body-file "$RUNNER_TEMP/comentario.md"
          if [ "$RESULTADO" = "ok" ]; then
            gh issue close "$NUMERO"
          else
            gh label create error --force --color B60205 --description "La petición de biblioteca no se pudo procesar" > /dev/null
            gh issue edit "$NUMERO" --add-label error
          fi
