<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Reminiscencia</title>
  <meta name="description" content="Música para recordar, organizada por álbumes. Sin cuentas: tus listas se guardan en este navegador.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231ed760'/%3E%3Cpath d='M12 22V10l10-2v12' fill='none' stroke='%23000' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/figtree-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/figtree-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main" data-testid="skip-link">Saltar al contenido</a>
  <div class="app" id="app">
    <header class="topbar" data-testid="topbar">
      <div class="topbar-left">
        <a class="brand" href="#/" data-testid="brand">Reminiscencia</a>
      </div>
      <div class="topbar-center">
        <a class="home-button" href="#/" aria-label="Inicio" data-nav="inicio" data-testid="nav-inicio">
          <span class="nav-icon" data-icon-active>
            <svg class="icon nav-icon-off" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M12 3.2 3.5 10.3V20.5h6v-6h5v6h6V10.3L12 3.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            <svg class="icon nav-icon-on" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" hidden><path d="M12 3.2 3.5 10.3V20.5h6v-6h5v6h6V10.3L12 3.2z" fill="currentColor"/></svg>
          </span>
        </a>
        <form class="top-search" role="search" data-testid="top-search">
          <label class="sr-only" for="top-search-input">Buscar canciones, álbumes y listas</label>
          <span class="top-search-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
          <input class="top-search-input" id="top-search-input" type="search" placeholder="¿Qué quieres reproducir?" autocomplete="off" spellcheck="false" enterkeyhint="search" data-testid="top-search-input">
          <button class="top-search-clear" id="top-search-clear" type="button" aria-label="Borrar la búsqueda" data-testid="top-search-clear" hidden><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <span class="top-search-divider" aria-hidden="true"></span>
          <a class="explore-button" href="#/buscar" aria-label="Explorar" data-nav="buscar" data-testid="nav-buscar">
            <span class="nav-icon" data-icon-active>
              <svg class="icon nav-icon-off" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M3.5 9.5 6 4.5h12l2.5 5v10h-17zM3.5 9.5h17M9.5 13.5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
              <svg class="icon nav-icon-on" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" hidden><path d="M3.5 9.5 6 4.5h12l2.5 5v10h-17z" fill="currentColor"/><path d="M3.5 9.5h17M9.5 13.5h5" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
            </span>
          </a>
        </form>
      </div>
      <div class="topbar-right"></div>
    </header>

    <nav class="panel sidebar" id="sidebar" aria-labelledby="titulo-biblioteca" data-testid="sidebar">
      <div class="library-resize" id="library-resize" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Ancho de Tu biblioteca" aria-valuemin="280" aria-valuemax="420" aria-valuenow="280" data-testid="library-resize"></div>
    </nav>

    <main class="panel main" id="main" tabindex="-1" data-testid="main">
      <p class="offline-banner" id="offline-banner" role="status" data-testid="offline-banner" hidden>Sin conexión. Solo suenan las canciones descargadas y las subidas a este navegador.</p>
      <div id="view" class="view"></div>
    </main>

    <aside class="panel now-panel" id="now-panel" aria-labelledby="titulo-reproduciendo" data-testid="now-panel" hidden></aside>

    <footer class="player-bar" id="player-bar" aria-label="Reproductor" data-testid="player-bar"></footer>

    <div class="mini-player" id="mini-player" data-testid="mini-player" hidden></div>

    <nav class="tabbar" aria-label="Principal" data-testid="tabbar">
      <a class="tab-link" href="#/" data-nav="inicio" data-testid="tab-inicio">
        <span class="nav-icon" data-icon-active>
          <svg class="icon nav-icon-off" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M12 3.2 3.5 10.3V20.5h6v-6h5v6h6V10.3L12 3.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <svg class="icon nav-icon-on" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" hidden><path d="M12 3.2 3.5 10.3V20.5h6v-6h5v6h6V10.3L12 3.2z" fill="currentColor"/></svg>
        </span>
        <span class="tab-label">Inicio</span>
      </a>
      <a class="tab-link" href="#/buscar" data-nav="buscar" data-testid="tab-buscar">
        <span class="nav-icon" data-icon-active>
          <svg class="icon nav-icon-off" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="icon nav-icon-on" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" hidden><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="3"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </span>
        <span class="tab-label">Buscar</span>
      </a>
      <a class="tab-link" href="#/biblioteca" data-nav="biblioteca" data-testid="tab-biblioteca">
        <span class="nav-icon" data-icon-active>
          <svg class="icon nav-icon-off" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M4.5 3.5v17M9.5 3.5v17M14 4.2l5.5 16.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="icon nav-icon-on" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" hidden><path d="M4.5 3.5v17M9.5 3.5v17M14 4.2l5.5 16.3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </span>
        <span class="tab-label">Tu biblioteca</span>
      </a>
    </nav>
  </div>
  <div class="update-notice" role="status" aria-live="polite" data-testid="update-notice"></div>
  <p class="toast" role="status" aria-live="polite" data-testid="toast"></p>
  <audio id="audio" preload="metadata"></audio>
  <noscript><p class="noscript">Reminiscencia necesita JavaScript para funcionar.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
