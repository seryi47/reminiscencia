<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <title>Reminiscencia</title>
  <meta name="description" content="Música para recordar, organizada por carpetas.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e0b26a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="listen.css">
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>

  <div class="app" data-tab="library">
    <aside class="side" aria-label="Biblioteca">
      <div class="brand"><span class="brand-dot" aria-hidden="true"></span><span>Reminiscencia</span></div>

      <nav class="nav" aria-label="Carpetas">
        <p class="nav-label">Biblioteca</p>
        <button class="nav-item" type="button" data-folder="all" aria-current="true">
          <span class="nav-text">Todas las canciones</span><span class="count" data-count="all">0</span>
        </button>
        <button class="nav-item" type="button" data-folder="none">
          <span class="nav-text">Sin carpeta</span><span class="count" data-count="none">0</span>
        </button>
        <p class="nav-label">Carpetas</p>
        <div id="tree" class="tree"></div>
        <p class="nav-empty" id="tree-empty" hidden>Aún no hay carpetas.</p>
      </nav>

      <p class="side-foot">Grabaciones de dominio público.</p>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <section class="content" id="main" tabindex="-1">
      <header class="top">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <span class="visually-hidden">Buscar canciones</span>
          <input id="search" type="search" placeholder="Buscar título, artista o etiqueta" autocomplete="off">
        </label>
        <p class="status" id="status" role="status">Cargando…</p>
      </header>

      <div class="chips" id="chips" aria-label="Carpetas"></div>

      <div class="head">
        <h1 id="title">Todas las canciones</h1>
        <p class="muted" id="subtitle"></p>
      </div>

      <div class="list-wrap">
        <ol class="list" id="list" aria-label="Canciones"></ol>
        <p class="empty" id="empty" hidden>No hay canciones que coincidan.</p>
      </div>
    </section>

    <!-- Reproductor fijo (escritorio) / minirreproductor (móvil) -->
    <section class="player" aria-label="Reproductor">
      <button class="now-mini" id="open-now" type="button" aria-label="Abrir la reproducción">
        <span class="art art-s" id="mini-art" aria-hidden="true"></span>
        <span class="mini-text">
          <span class="mini-title" id="mini-title">Elige una canción</span>
          <span class="mini-sub" id="mini-sub">&nbsp;</span>
        </span>
      </button>

      <div class="transport">
        <div class="controls">
          <button class="ctl" id="prev" type="button" aria-label="Anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM19 6.5v11L9.5 12z"/></svg>
          </button>
          <button class="ctl ctl-main" id="toggle" type="button" aria-label="Reproducir" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" id="toggle-icon"><path d="M8 5.5v13l11-6.5z"/></svg>
          </button>
          <button class="ctl" id="next" type="button" aria-label="Siguiente">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM5 6.5v11L14.5 12z"/></svg>
          </button>
        </div>
        <div class="progress">
          <span class="time" id="time-now">0:00</span>
          <input type="range" id="seek" min="0" max="0" step="1" value="0" aria-label="Posición">
          <span class="time" id="time-total">0:00</span>
        </div>
      </div>

      <div class="volume">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/></svg>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8" aria-label="Volumen">
      </div>
      <audio id="audio" preload="metadata"></audio>
    </section>

    <!-- Vista completa (móvil) -->
    <section class="now" id="now" aria-label="Reproducción" hidden>
      <button class="now-close" id="now-close" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span class="art art-xl" id="now-art" aria-hidden="true"></span>
      <p class="eyebrow" id="now-count">&nbsp;</p>
      <h2 id="now-title">Elige una canción</h2>
      <p class="muted" id="now-sub">&nbsp;</p>
      <div class="controls controls-lg">
        <button class="ctl" id="now-prev" type="button" aria-label="Anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM19 6.5v11L9.5 12z"/></svg>
        </button>
        <button class="ctl ctl-main ctl-xl" id="now-toggle" type="button" aria-label="Reproducir">
          <svg viewBox="0 0 24 24" aria-hidden="true" id="now-toggle-icon"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button class="ctl" id="now-next" type="button" aria-label="Siguiente">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM5 6.5v11L14.5 12z"/></svg>
        </button>
      </div>
    </section>

    <nav class="tabbar" aria-label="Navegación móvil">
      <button class="tab" type="button" data-tab="library" aria-current="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6.5l10-2v11"/><circle cx="7" cy="17.5" r="2.5"/><circle cx="17" cy="15.5" r="2.5"/></svg>
        <span>Biblioteca</span>
      </button>
      <button class="tab" type="button" data-tab="folders">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2.5h8A1.5 1.5 0 0 1 20.5 10v7A1.5 1.5 0 0 1 19 18.5H5A1.5 1.5 0 0 1 3.5 17z"/></svg>
        <span>Carpetas</span>
      </button>
      <button class="tab" type="button" data-tab="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <span>Buscar</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
