# Worker de Cloudflare «reminiscencia-api» (ADR-0029). Despliegue (desde esta carpeta, con la versión fijada):
#   npx --yes wrangler@4.151.3 login
#   npx --yes wrangler@4.151.3 secret put GITHUB_TOKEN
#   npx --yes wrangler@4.151.3 deploy
# La guía completa está en docs/decisions/ADR-0029-worker-cloudflare-y-portadas.md.
#
# Wrangler empaqueta src/index.js con sus importaciones relativas (también las de ../frontend/web/server/ y
# ../frontend/web/js/, el código compartido con las funciones de Vercel). No hay dependencias en tiempo de ejecución.
#
# Desde ADR-0034 el mismo Worker sirve también la web estática (frontend/web) en https://reminiscencia.cometia.es.
# Cloudflare Workers Builds lo despliega solo con cada push a main (directorio raíz «worker»; ver ADR-0034).

name = "reminiscencia-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Dirección pública https://reminiscencia-api.<subdominio>.workers.dev (el subdominio es el de la cuenta). Se mantiene:
# las APK ya instaladas llaman a esa dirección (ADR-0034).
workers_dev = true
# Dominio propio (ADR-0034): la web y el API en el mismo origen. Cloudflare crea el registro DNS del subdominio en la
# zona cometia.es al desplegar.
routes = [{ pattern = "reminiscencia.cometia.es", custom_domain = true }]
# Sin direcciones de vista previa por versión: solo la dirección principal sirve el API.
preview_urls = false

# Bucket privado: los trozos de las subidas (entrada/<UUID>/) y la fuente de verdad del audio (ADR-0024).
[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "reminiscencia-audio-privado"

# Bucket público (r2.dev): el audio público y las portadas (portadas/<id>-<hash>.jpg y portadas/indice.json).
[[r2_buckets]]
binding = "PUBLIC_BUCKET"
bucket_name = "reminiscencia-audio"

# La web estática (ADR-0034): los ficheros de frontend/web, menos lo que no es web (frontend/web/.assetsignore: las
# funciones de Vercel, server/, package.json, vercel.json…). Las cabeceras (CSP) van en frontend/web/_headers. Solo
# /api/* y /audio/* pasan primero por el Worker; lo demás lo sirve Cloudflare directamente desde los ficheros.
[assets]
directory = "../frontend/web"
binding = "ASSETS"
run_worker_first = ["/api/*", "/audio/*"]

[vars]
# ALLOW_LOCALHOST no va aquí NUNCA: en producción el Worker no admite localhost (incidente del 2026-11-06). Para
# desarrollar en local: «npx --yes wrangler@4.151.3 dev --var ALLOW_LOCALHOST:1».
# Orígenes extra con CORS, separados por comas (la web de producción y localhost ya están admitidos en el código).
# La copia de la web en Netlify (ADR-0037) llama al API y al audio desde su dominio, como la de Vercel.
ALLOWED_ORIGINS = "https://reminiscencia.netlify.app"

# Reenvío de /api/youtube/search y /playlist (ADR-0038), por orden: se usa el primero que responda con la cabecera-marca.
# Vercel primero para que, al desbloquearse el 2026-12-07, vuelva a usarse solo; Netlify de respaldo mientras tanto.
# convert/status/download NO se reenvían: los ejecuta el propio Worker. Vaciar o quitar esta variable usa el valor por
# defecto del código (el mismo orden).
YOUTUBE_UPSTREAMS = "https://reminiscencia.vercel.app,https://reminiscencia.netlify.app"

# Secreto (no va aquí): GITHUB_TOKEN, con «wrangler secret put GITHUB_TOKEN». El mismo tipo de token que Vercel:
# grano fino, solo seryi47/reminiscencia, Contents e Issues en escritura.
