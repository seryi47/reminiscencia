[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonidos"
version = "0.1.0"
description = "Biblioteca musical para el proyecto doctoral Música, memoria y Alzheimer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["sonidos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
