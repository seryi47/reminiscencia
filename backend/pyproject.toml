[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonidos"
version = "0.1.0"
description = "Biblioteca musical para el proyecto doctoral Música, memoria y Alzheimer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# ADR-0049: `pytest-xdist` paraleliza la suite entre los núcleos del runner (CI y local). Con 1445 tests baja de
# ~60-120 s a ~20-40 s. `backend.yml` ya pasa `-n auto`.
dev = ["pytest>=8", "pytest-xdist>=3"]

[tool.setuptools.packages.find]
include = ["sonidos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
